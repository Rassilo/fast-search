[workspace]
resolver = "3"
members = ["crates/ff-core", "crates/ff-cli", "crates/ff-gui", "crates/ff-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Size-first release build: one static binary, no unwinding tables, no symbols.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
